name: Build Nimvex Windows preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'browser.py'
      - 'assets/**'
      - 'License'
      - 'packaging/windows/**'
      - '.github/workflows/nimvex-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        run: python -m pip install PySide6 PyInstaller

      - name: Record dependency versions
        run: python -m pip freeze

      - name: Build Windows preview
        run: python packaging/windows/build.py

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: Nimvex-Windows-x64-preview
          path: windows-output/Nimvex-Windows-x64-preview.zip
          if-no-files-found: error
          retention-days: 14
