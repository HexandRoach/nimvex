name: Sync website release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: HexandRoach/linux-game-compatibility-guide
          token: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          path: website
          fetch-depth: 1

      - name: Read GitHub project information
        id: project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          description="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.description // ""')"
          {
            printf 'description=%s\n' "$description"
            printf 'slug=%s\n' "${GITHUB_REPOSITORY##*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Determine release download
        id: release
        env:
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_ASSETS: ${{ toJSON(github.event.release.assets) }}
        run: |
          download_url="$(printf '%s' "$RELEASE_ASSETS" | jq -r '
            [
              .[]
              | select(.name | test("\\.(rpm|appimage)$"; "i"))
              | select(.name | test("\\.sig$"; "i") | not)
            ][0].browser_download_url // empty
          ')"

          if [ -z "$download_url" ]; then
            echo "No RPM or AppImage asset was attached to this release." >&2
            exit 1
          fi

          file_name="$(basename "$download_url")"

          {
            printf 'download_url=%s\n' "$download_url"
            printf 'release_url=%s\n' "$RELEASE_URL"
            printf 'updated=%s\n' "$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

      - name: Update project release data
        working-directory: website
        env:
          SLUG: ${{ steps.project.outputs.slug }}
          DESCRIPTION: ${{ steps.project.outputs.description }}
          NOTES: ${{ github.event.release.body }}
          VERSION: ${{ github.event.release.tag_name }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          UPDATED: ${{ steps.release.outputs.updated }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          slug = os.environ["SLUG"]
          if not slug or any(c not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_" for c in slug):
              raise SystemExit("Invalid project slug")

          path = Path("data/projects") / (slug + ".json")
          data = json.loads(path.read_text(encoding="utf-8"))

          data["description"] = os.environ.get("DESCRIPTION") or data.get("description", "")
          data["notes"] = os.environ.get("NOTES", "")
          data["version"] = os.environ["VERSION"].removeprefix("v")
          data["download_url"] = os.environ["DOWNLOAD_URL"]
          data["release_url"] = os.environ["RELEASE_URL"]
          data["updated"] = os.environ["UPDATED"]

          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit and push website update
        working-directory: website
        run: |
          git config user.name "website-release-sync"
          git config user.email "actions@users.noreply.github.com"
          git add "data/projects/${{ steps.project.outputs.slug }}.json"

          if git diff --cached --quiet; then
            echo "Website release data is already current."
            exit 0
          fi

          git commit -m "Update ${{ steps.project.outputs.slug }}: ${{ github.event.release.tag_name }}"
          git push
