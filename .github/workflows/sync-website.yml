name: Sync website release

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nimvex-website-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          repository: HexandRoach/linux-game-compatibility-guide
          token: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          path: website
          fetch-depth: 1

      - name: Read release and RPM download information
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_ASSETS: ${{ toJSON(github.event.release.assets) }}
        run: |
          rpm_url="$(printf '%s' "$RELEASE_ASSETS" | jq -r '
            [.[] | select(.name | test("\\.rpm$"; "i"))][0].browser_download_url // empty
          ')"

          if [ -z "$rpm_url" ]; then
            echo "No .rpm asset was attached to this release." >&2
            exit 1
          fi

          rpm_name="$(basename "$rpm_url")"
          version="$(sed -nE 's/^nimvex-([^-]+-[0-9]+)\..*$/\1/p' <<<"$rpm_name")"

          if [ -z "$version" ]; then
            echo "Could not determine the Nimvex version from: $rpm_name" >&2
            exit 1
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'rpm_url=%s\n' "$rpm_url"
            printf 'release_url=%s\n' "$RELEASE_URL"
            printf 'updated=%s\n' "$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

      - name: Update Nimvex website data
        working-directory: website
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RPM_URL: ${{ steps.release.outputs.rpm_url }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          UPDATED: ${{ steps.release.outputs.updated }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/projects/nimvex.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = "${{ env.VERSION }}"
          data["rpm_url"] = "${{ env.RPM_URL }}"
          data["release_url"] = "${{ env.RELEASE_URL }}"
          data["updated"] = "${{ env.UPDATED }}"
          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit and push website update
        working-directory: website
        run: |
          git config user.name "nimvex-website-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/projects/nimvex.json

          if git diff --cached --quiet; then
              echo "Website release data is already current."
              exit 0
          fi

          git commit -m "Update Nimvex release: ${{ steps.release.outputs.version }}"
          git push
